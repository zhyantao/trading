<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}量化交易研究{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    {% block head %}{% endblock %}
</head>
<body>

<!-- 站点互跳导航（与 zhyantao.github.io 各站页眉一致） -->
<nav class="site-nav" aria-label="站点导航">
    <div class="nav-inner">
        <a href="index.html?date={{ selected_date }}"><img class="nav-badge" src="favicon.svg" alt="BOT"></a>
        <a href="https://zhyantao.github.io/">ZHYANTAO</a>
        <a href="https://zhyantao.github.io/docs/">DOCS</a>
        <a href="https://zhyantao.github.io/PS1-generator/">PS1</a>
        <a href="https://zhyantao.github.io/callgraphs-generator/">CALLGRAPH</a>
        <a href="https://zhyantao.github.io/riscv-bitlab/">RISC-V</a>
        <a href="index.html?date={{ selected_date }}" class="active">TRADING</a>
    </div>
</nav>

<nav class="app-nav">
    <div class="nav-inner">
        <a href="index.html?date={{ selected_date }}" class="brand">量化信号</a>
        <input type="checkbox" id="nav-toggle">
        <div class="nav-links">
            <a href="index.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'dashboard' }}">总览</a>
            <a href="signals.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'signals' }}">每日信号</a>
            <a href="holdings.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'holdings' }}">我的持仓</a>
            <a href="managers.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'managers' }}">经理排名</a>
            <a href="funds.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'funds' }}">基金排名</a>
            <a href="stocks.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'stocks' }}">股票排名</a>
            <a href="elite.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'elite' }}">绩优标的</a>
            <a href="backtest.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'backtest' }}">回测</a>
            <a href="pipeline.html?date={{ selected_date }}" class="{{ 'active' if active_page == 'pipeline' }}">流水线</a>
        </div>
        <div class="nav-actions">
        <label for="nav-toggle" class="nav-toggle-btn" aria-label="菜单">
            <span></span><span></span><span></span>
        </label>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<footer class="site-footer">
    <hr class="slender">
    <div class="credits">&copy; 2026 YANTAO ZHANG &middot; Powered by <a href="https://github.com/edwardtufte/tufte-css">Tufte CSS</a></div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
