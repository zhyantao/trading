<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Trading Bot">
  <!-- 量化交易研究：K 线蜡烛图（涨红跌绿） -->
  <rect width="64" height="64" fill="#fffff8"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" fill="none" stroke="#111111" stroke-width="1.5"/>
  <!-- 基线 -->
  <line x1="9" y1="50" x2="55" y2="50" stroke="#6b6b60" stroke-width="0.8"/>
  <!-- 阳线（涨，红） -->
  <line x1="18" y1="20" x2="18" y2="46" stroke="#111111" stroke-width="1.2"/>
  <rect x="14" y="28" width="8" height="12" fill="#a00000"/>
  <!-- 阴线（跌，绿） -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="#111111" stroke-width="1.2"/>
  <rect x="28" y="24" width="8" height="16" fill="#2e7d32"/>
  <!-- 阳线（涨，红） -->
  <line x1="46" y1="24" x2="46" y2="44" stroke="#111111" stroke-width="1.2"/>
  <rect x="42" y="30" width="8" height="10" fill="#a00000"/>
</svg>
